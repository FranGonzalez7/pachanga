<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1050" preserveAspectRatio="xMidYMid slice">
  <!-- Césped: fondo base -->
  <rect x="0" y="0" width="680" height="1050" fill="#2E7D32"/>
  <!-- Franjas verticales alternadas (ligeramente más claras) -->
  <rect x="85" y="0" width="85" height="1050" fill="#38913C"/>
  <rect x="255" y="0" width="85" height="1050" fill="#38913C"/>
  <rect x="425" y="0" width="85" height="1050" fill="#38913C"/>
  <rect x="595" y="0" width="85" height="1050" fill="#38913C"/>

  <!-- Todas las líneas del campo comparten estilo -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4">
    <!-- Borde exterior -->
    <rect x="20" y="20" width="640" height="1010"/>
    <!-- Línea de medio campo -->
    <line x1="20" y1="525" x2="660" y2="525"/>
    <!-- Círculo central -->
    <circle cx="340" cy="525" r="90"/>

    <!-- Área grande superior -->
    <rect x="140" y="20" width="400" height="165"/>
    <!-- Área pequeña superior -->
    <rect x="250" y="20" width="180" height="55"/>
    <!-- Semicírculo del área superior -->
    <path d="M 268.8 185 A 90 90 0 0 0 411.2 185"/>

    <!-- Área grande inferior -->
    <rect x="140" y="865" width="400" height="165"/>
    <!-- Área pequeña inferior -->
    <rect x="250" y="975" width="180" height="55"/>
    <!-- Semicírculo del área inferior -->
    <path d="M 268.8 865 A 90 90 0 0 1 411.2 865"/>

    <!-- Córners -->
    <path d="M 20 35 A 15 15 0 0 0 35 20"/>
    <path d="M 645 20 A 15 15 0 0 0 660 35"/>
    <path d="M 35 1030 A 15 15 0 0 0 20 1015"/>
    <path d="M 660 1015 A 15 15 0 0 0 645 1030"/>
  </g>

  <!-- Puntos: centro y penaltis -->
  <g fill="#FFFFFF">
    <circle cx="340" cy="525" r="6"/>
    <circle cx="340" cy="130" r="6"/>
    <circle cx="340" cy="920" r="6"/>
  </g>
</svg>
